    <!-- Instant theme sync to prevent FOUC -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('theme-preference') || 'system';
          const isDark = stored === 'dark' || (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

  <body class="bg-neutral-50 text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 transition-colors duration-200 min-h-screen">

  </body>
